<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0b1f3a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="680" rx="10" fill="#f5f7fa"/>

  <!-- window frame -->
  <g filter="url(#shadow)">
    <rect x="28" y="28" width="824" height="624" rx="10" fill="#012456"/>
  </g>
  <!-- title bar -->
  <rect x="28" y="28" width="824" height="52" rx="10" fill="url(#titlebar)"/>
  <rect x="28" y="68" width="824" height="12" fill="url(#titlebar)"/>
  <rect x="29.5" y="28.5" width="821" height="622.5" rx="9" fill="none" stroke="#c3ccd6" stroke-width="1.5"/>
  <!-- PowerShell icon -->
  <rect x="52" y="42" width="24" height="24" rx="4" fill="#012456"/>
  <text x="58" y="60" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" fill="#ffffff" font-weight="bold">&gt;_</text>
  <text x="86" y="58" font-size="14" fill="#1b2a3a" font-weight="600">Windows PowerShell</text>
  <text x="352" y="58" font-size="12" fill="#6b7686" font-family="Consolas,'Cascadia Mono',monospace">Invoke-ADSecurityAudit.ps1 — sample-data run</text>
  <!-- window controls -->
  <line x1="770" y1="54" x2="784" y2="54" stroke="#5b6673" stroke-width="1.6"/>
  <rect x="800" y="47" width="14" height="14" fill="none" stroke="#5b6673" stroke-width="1.6"/>
  <line x1="838" y1="47" x2="852" y2="61" stroke="#5b6673" stroke-width="1.6"/>
  <line x1="852" y1="47" x2="838" y2="61" stroke="#5b6673" stroke-width="1.6"/>
  <line x1="29.5" y1="80.5" x2="850.5" y2="80.5" stroke="#c3ccd6" stroke-width="1"/>

  <!-- console body -->
  <g font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5">
    <text x="56" y="122" fill="#f5f5f5"><tspan fill="#e8c547" font-weight="bold">PS</tspan><tspan> C:\audit&gt; </tspan><tspan>.\Invoke-ADSecurityAudit.ps1 -UsersCsv </tspan><tspan fill="#9ecbff">"./SampleData/users.csv"</tspan><tspan> `</tspan></text>
    <text x="56" y="150" fill="#f5f5f5"><tspan fill="#e8c547" font-weight="bold">PS</tspan><tspan> C:\audit&gt; </tspan><tspan>-GroupsCsv </tspan><tspan fill="#9ecbff">"./SampleData/groups.csv"</tspan><tspan> `</tspan></text>
    <text x="56" y="178" fill="#f5f5f5"><tspan fill="#e8c547" font-weight="bold">&gt;&gt;</tspan><tspan> -ComputersCsv </tspan><tspan fill="#9ecbff">"./SampleData/computers.csv"</tspan><tspan> -ReportFolder </tspan><tspan fill="#9ecbff">"./Reports"</tspan></text>

    <text x="56" y="228" fill="#d7e3f4">Loading data...</text>
    <text x="56" y="256" fill="#d7e3f4">Running tests...</text>
    <text x="56" y="284" fill="#ffffff" font-weight="bold">Discovered <tspan fill="#e8c547">16</tspan> findings.</text>
    <text x="56" y="312" fill="#d7e3f4">Generating reports...</text>
    <text x="56" y="340" fill="#ffffff">Audit complete. Reports saved to <tspan fill="#9ecbff">.\Reports</tspan></text>

    <line x1="56" y1="374" x2="824" y2="374" stroke="#2c4f7c" stroke-width="1"/>

    <text x="56" y="406" fill="#8fa8c8" font-size="12" letter-spacing="2" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">CHECK RESULTS — SAMPLE DATA</text>

    <g font-size="13.5">
      <text x="56" y="434" fill="#d7e3f4">Test-StaleAccounts <tspan fill="#7e93ae">···········</tspan> <tspan fill="#ffffff" font-weight="bold">3</tspan> <tspan fill="#7e93ae">stale accounts (no logon in 90+ days)</tspan></text>
      <text x="56" y="458" fill="#d7e3f4">Test-PasswordNeverExpires <tspan fill="#7e93ae">···</tspan> <tspan fill="#ffffff" font-weight="bold">2</tspan> <tspan fill="#7e93ae">enabled accounts with 'Password Never Expires'</tspan></text>
      <text x="56" y="482" fill="#d7e3f4">Test-OldPasswordAge <tspan fill="#7e93ae">··········</tspan> <tspan fill="#ffffff" font-weight="bold">4</tspan> <tspan fill="#7e93ae">passwords older than 365 days</tspan></text>
      <text x="56" y="506" fill="#d7e3f4">Test-PrivilegedGroupMembership <tspan fill="#7e93ae">·</tspan> <tspan fill="#ffffff" font-weight="bold">3</tspan> <tspan fill="#7e93ae">unapproved or disabled privileged members</tspan></text>
      <text x="56" y="530" fill="#d7e3f4">Test-OutdatedOS <tspan fill="#7e93ae">···············</tspan> <tspan fill="#ffffff" font-weight="bold">2</tspan> <tspan fill="#7e93ae">computers on end-of-life operating systems</tspan></text>
      <text x="56" y="554" fill="#d7e3f4">Test-DuplicateSPNs <tspan fill="#7e93ae">···········</tspan> <tspan fill="#ffffff" font-weight="bold">2</tspan> <tspan fill="#7e93ae">SPNs registered to multiple accounts</tspan></text>
    </g>

    <line x1="56" y1="576" x2="824" y2="576" stroke="#2c4f7c" stroke-width="1"/>

    <!-- severity breakdown -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13">
      <circle cx="60" cy="598" r="5" fill="#d43d2f"/>
      <text x="72" y="603" fill="#f5f5f5">4 Critical</text>
      <circle cx="172" cy="598" r="5" fill="#e8930c"/>
      <text x="184" y="603" fill="#f5f5f5">5 High</text>
      <circle cx="262" cy="598" r="5" fill="#e8c547"/>
      <text x="274" y="603" fill="#f5f5f5">7 Medium</text>
      <text x="824" y="603" fill="#7e93ae" text-anchor="end" font-size="12">findings sorted by severity in the HTML report</text>
    </g>
  </g>
</svg>
