<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0b1f3a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0078d4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="760" rx="10" fill="#f5f7fa"/>

  <!-- header -->
  <text x="40" y="52" font-size="22" font-weight="700" fill="#1b2a3a">How the audit runs</text>
  <text x="40" y="76" font-size="13.5" fill="#5b6673">Offline by design — CSV exports in, timestamped reports out. No live domain connection.</text>

  <!-- pipeline cards -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="236" height="196" rx="8" fill="#ffffff" stroke="#d4d9e0" stroke-width="1"/>
    <rect x="308" y="100" width="264" height="196" rx="8" fill="#ffffff" stroke="#d4d9e0" stroke-width="1"/>
    <rect x="604" y="100" width="236" height="196" rx="8" fill="#ffffff" stroke="#d4d9e0" stroke-width="1"/>
  </g>

  <!-- card 1: inputs -->
  <rect x="40" y="100" width="5" height="196" fill="#0078d4"/>
  <text x="60" y="134" font-size="12" letter-spacing="1.6" fill="#5b6673" font-weight="600">1 · OFFLINE INPUTS</text>
  <g font-family="Consolas,'Cascadia Mono',monospace" font-size="13">
    <text x="60" y="164" fill="#1b2a3a">users.csv <tspan fill="#8a94a0">····</tspan> <tspan fill="#0078d4" font-weight="bold">13</tspan> <tspan fill="#8a94a0">rows</tspan></text>
    <text x="60" y="190" fill="#1b2a3a">groups.csv <tspan fill="#8a94a0">···</tspan> <tspan fill="#0078d4" font-weight="bold">5</tspan> <tspan fill="#8a94a0">rows</tspan></text>
    <text x="60" y="216" fill="#1b2a3a">computers.csv <tspan fill="#8a94a0"></tspan> <tspan fill="#0078d4" font-weight="bold">8</tspan> <tspan fill="#8a94a0">rows</tspan></text>
  </g>
  <text x="60" y="250" font-size="12" fill="#8a94a0">Exported from a live environment</text>
  <text x="60" y="268" font-size="12" fill="#8a94a0" font-family="Consolas,'Cascadia Mono',monospace">Get-ADUser | Get-ADGroup |</text>
  <text x="60" y="284" font-size="12" fill="#8a94a0" font-family="Consolas,'Cascadia Mono',monospace">Get-ADComputer → CSV</text>

  <!-- arrows -->
  <line x1="276" y1="198" x2="302" y2="198" stroke="#0078d4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="198" x2="598" y2="198" stroke="#0078d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- card 2: orchestrator -->
  <rect x="308" y="100" width="5" height="196" fill="#0078d4"/>
  <text x="328" y="134" font-size="12" letter-spacing="1.6" fill="#5b6673" font-weight="600">2 · ORCHESTRATOR</text>
  <text x="328" y="162" font-size="14" font-weight="700" fill="#1b2a3a" font-family="Consolas,'Cascadia Mono',monospace">Invoke-ADSecurityAudit.ps1</text>
  <text x="328" y="192" font-size="12.5" fill="#3d4753">Import-Csv <tspan font-family="Consolas,'Cascadia Mono',monospace">×3</tspan>, dot-sources modules</text>
  <text x="328" y="216" font-size="12.5" fill="#3d4753">Runs each check, collects findings</text>
  <text x="328" y="240" font-size="12.5" fill="#3d4753">into <tspan font-family="Consolas,'Cascadia Mono',monospace">$allFindings</tspan></text>
  <text x="328" y="272" font-size="12" fill="#8a94a0">Parameters: -UsersCsv -GroupsCsv</text>
  <text x="328" y="288" font-size="12" fill="#8a94a0">-ComputersCsv -ReportFolder</text>

  <!-- card 3: reports -->
  <rect x="604" y="100" width="5" height="196" fill="#0078d4"/>
  <text x="624" y="134" font-size="12" letter-spacing="1.6" fill="#5b6673" font-weight="600">3 · REPORTS</text>
  <g font-family="Consolas,'Cascadia Mono',monospace" font-size="12.5">
    <text x="624" y="164" fill="#1b2a3a">AuditFindings_</text>
    <text x="624" y="188" fill="#1b2a3a"><tspan fill="#8a94a0">yyyyMMdd_HHmmss</tspan><tspan fill="#0078d4">.html</tspan></text>
    <text x="624" y="212" fill="#1b2a3a"><tspan fill="#8a94a0">yyyyMMdd_HHmmss</tspan><tspan fill="#0078d4">.csv</tspan></text>
    <text x="624" y="236" fill="#1b2a3a"><tspan fill="#8a94a0">yyyyMMdd_HHmmss</tspan><tspan fill="#0078d4">.json</tspan></text>
  </g>
  <text x="624" y="268" font-size="12" fill="#8a94a0">Timestamped per run → .\Reports</text>
  <text x="624" y="286" font-size="12" fill="#8a94a0">HTML report: severity-sorted</text>

  <!-- check modules -->
  <text x="40" y="348" font-size="12" letter-spacing="1.6" fill="#5b6673" font-weight="600">MODULAR CHECK FUNCTIONS — PUBLIC/</text>
  <text x="40" y="370" font-size="13" fill="#8a94a0">Each check returns finding objects (Finding · Severity · AccountName · Details). 7 invocations per run.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="390" width="800" height="330" rx="8" fill="#ffffff" stroke="#d4d9e0" stroke-width="1"/>
  </g>

  <g font-size="13.5">
    <!-- header row -->
    <text x="64" y="424" font-size="11.5" letter-spacing="1.4" fill="#8a94a0" font-weight="600">CHECK FUNCTION</text>
    <text x="330" y="424" font-size="11.5" letter-spacing="1.4" fill="#8a94a0" font-weight="600">SCOPE</text>
    <text x="470" y="424" font-size="11.5" letter-spacing="1.4" fill="#8a94a0" font-weight="600">FINDING PRODUCED</text>
    <text x="740" y="424" font-size="11.5" letter-spacing="1.4" fill="#8a94a0" font-weight="600">SEVERITY</text>
    <line x1="64" y1="436" x2="816" y2="436" stroke="#e2e6ec" stroke-width="1"/>

    <!-- rows -->
    <text x="64" y="464" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-StaleAccounts</text>
    <text x="330" y="464" fill="#5b6673">users, computers (×2)</text>
    <text x="470" y="464" fill="#1b2a3a">Stale Account</text>
    <g><rect x="740" y="450" width="72" height="22" rx="11" fill="#fff8e1" stroke="#efe3a1"/><text x="776" y="465" font-size="11.5" text-anchor="middle" fill="#8a6d00" font-weight="700">Medium</text></g>

    <text x="64" y="504" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-PasswordNeverExpires</text>
    <text x="330" y="504" fill="#5b6673">users</text>
    <text x="470" y="504" fill="#1b2a3a">Password Never Expires</text>
    <g><rect x="740" y="490" width="56" height="22" rx="11" fill="#fdf3e7" stroke="#f0d9b5"/><text x="768" y="505" font-size="11.5" text-anchor="middle" fill="#b54708" font-weight="700">High</text></g>

    <text x="64" y="544" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-OldPasswordAge</text>
    <text x="330" y="544" fill="#5b6673">users</text>
    <text x="470" y="544" fill="#1b2a3a">Old Password Age</text>
    <g><rect x="740" y="530" width="72" height="22" rx="11" fill="#fff8e1" stroke="#efe3a1"/><text x="776" y="545" font-size="11.5" text-anchor="middle" fill="#8a6d00" font-weight="700">Medium</text></g>

    <text x="64" y="584" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-PrivilegedGroupMembership</text>
    <text x="330" y="584" fill="#5b6673">users</text>
    <text x="470" y="578" fill="#1b2a3a">Unapproved Privileged User</text>
    <text x="470" y="598" fill="#1b2a3a">Disabled Account in Privileged Group</text>
    <g><rect x="740" y="566" width="60" height="22" rx="11" fill="#fdecea" stroke="#f5c6c0"/><text x="770" y="581" font-size="11.5" text-anchor="middle" fill="#b42318" font-weight="700">Critical</text></g>
    <g><rect x="740" y="592" width="56" height="22" rx="11" fill="#fdf3e7" stroke="#f0d9b5"/><text x="768" y="607" font-size="11.5" text-anchor="middle" fill="#b54708" font-weight="700">High</text></g>

    <text x="64" y="644" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-OutdatedOS</text>
    <text x="330" y="644" fill="#5b6673">computers</text>
    <text x="470" y="644" fill="#1b2a3a">Outdated Operating System</text>
    <g><rect x="740" y="630" width="56" height="22" rx="11" fill="#fdf3e7" stroke="#f0d9b5"/><text x="768" y="645" font-size="11.5" text-anchor="middle" fill="#b54708" font-weight="700">High</text></g>

    <text x="64" y="684" font-family="Consolas,'Cascadia Mono',monospace" fill="#1b2a3a" font-weight="600">Test-DuplicateSPNs</text>
    <text x="330" y="684" fill="#5b6673">users, computers</text>
    <text x="470" y="684" fill="#1b2a3a">Duplicate SPN</text>
    <g><rect x="740" y="670" width="60" height="22" rx="11" fill="#fdecea" stroke="#f5c6c0"/><text x="770" y="685" font-size="11.5" text-anchor="middle" fill="#b42318" font-weight="700">Critical</text></g>
  </g>
</svg>
