<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <pattern id="scanB" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" y="0" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#2fae5f" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1196" height="656" rx="14" fill="#070b08" stroke="#1d3a26" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="656" rx="14" fill="url(#scanB)"/>

  <g font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="34" y="42" font-size="17" fill="#33ff66">modular checks, one orchestrator</text>
    <text x="34" y="62" font-size="12" fill="#54705f">ad-security-auditor · every check is a separate, testable PowerShell function</text>

    <!-- inputs -->
    <rect x="24" y="96" width="200" height="300" rx="10" fill="#0a100c" stroke="#2fae5f" stroke-width="1.5"/>
    <text x="42" y="122" font-size="12" fill="#54705f">offline inputs</text>
    <rect x="42" y="136" width="164" height="46" rx="6" fill="#0f1a12" stroke="#1d3a26"/>
    <text x="56" y="156" font-size="13" fill="#e9f5ec">users.csv</text>
    <text x="56" y="174" font-size="11" fill="#7ba98c">13 accounts</text>
    <rect x="42" y="192" width="164" height="46" rx="6" fill="#0f1a12" stroke="#1d3a26"/>
    <text x="56" y="212" font-size="13" fill="#e9f5ec">groups.csv</text>
    <text x="56" y="230" font-size="11" fill="#7ba98c">5 groups</text>
    <rect x="42" y="248" width="164" height="46" rx="6" fill="#0f1a12" stroke="#1d3a26"/>
    <text x="56" y="268" font-size="13" fill="#e9f5ec">computers.csv</text>
    <text x="56" y="286" font-size="11" fill="#7ba98c">8 computers</text>
    <text x="42" y="322" font-size="11" fill="#54705f">exported via Get-ADUser,</text>
    <text x="42" y="340" font-size="11" fill="#54705f">Get-ADGroup, Get-ADComputer</text>
    <text x="42" y="372" font-size="11" fill="#54705f">sample data in SampleData/</text>

    <!-- orchestrator -->
    <rect x="268" y="96" width="236" height="300" rx="10" fill="#0a100c" stroke="#33ff66" stroke-width="2"/>
    <text x="286" y="122" font-size="12" fill="#54705f">orchestrator</text>
    <text x="286" y="148" font-size="13.5" fill="#33ff66">Invoke-ADSecurityAudit.ps1</text>
    <text x="286" y="178" font-size="12" fill="#9db8a6">· dot-sources Public/ + Private/</text>
    <text x="286" y="202" font-size="12" fill="#9db8a6">· Import-Csv × 3 datasets</text>
    <text x="286" y="226" font-size="12" fill="#9db8a6">· runs the 7 Test-* checks</text>
    <text x="286" y="250" font-size="12" fill="#9db8a6">· collects $allFindings</text>
    <text x="286" y="274" font-size="12" fill="#9db8a6">· New-HtmlReport →</text>
    <text x="300" y="298" font-size="12" fill="#9db8a6">timestamped reports</text>
    <text x="286" y="340" font-size="11" fill="#54705f">mandatory: -UsersCsv -GroupsCsv</text>
    <text x="300" y="358" font-size="11" fill="#54705f">-ComputersCsv [-ReportFolder]</text>

    <!-- check modules -->
    <g>
      <rect x="548" y="96" width="296" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="564" y="122" font-size="13" fill="#33ff66">Test-StaleAccounts</text>
      <text x="564" y="144" font-size="11.5" fill="#9db8a6">no logon 90+ days · users + computers</text>
      <text x="564" y="164" font-size="11" fill="#54705f">runs twice — users, then computers</text>

      <rect x="868" y="96" width="308" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="884" y="122" font-size="13" fill="#33ff66">Test-PasswordNeverExpires</text>
      <text x="884" y="144" font-size="11.5" fill="#9db8a6">PasswordNeverExpires flag set</text>
      <text x="884" y="164" font-size="11" fill="#54705f">service accounts need review</text>

      <rect x="548" y="200" width="296" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="564" y="226" font-size="13" fill="#33ff66">Test-OldPasswordAge</text>
      <text x="564" y="248" font-size="11.5" fill="#9db8a6">PasswordLastSet older than 365 days</text>
      <text x="564" y="268" font-size="11" fill="#54705f">-MaxPasswordAgeDays 365</text>

      <rect x="868" y="200" width="308" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="884" y="226" font-size="13" fill="#33ff66">Test-PrivilegedGroupMembership</text>
      <text x="884" y="248" font-size="11.5" fill="#9db8a6">unexpected Domain / Enterprise Admins</text>
      <text x="884" y="268" font-size="11" fill="#54705f">incl. disabled accounts in admin groups</text>

      <rect x="548" y="304" width="296" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="564" y="330" font-size="13" fill="#33ff66">Test-OutdatedOS</text>
      <text x="564" y="352" font-size="11.5" fill="#9db8a6">Windows 7 / Server 2008 and older</text>
      <text x="564" y="372" font-size="11" fill="#54705f">end-of-life operating systems</text>

      <rect x="868" y="304" width="308" height="86" rx="8" fill="#0a100c" stroke="#2fae5f" stroke-width="1.4"/>
      <text x="884" y="330" font-size="13" fill="#33ff66">Test-DuplicateSPNs</text>
      <text x="884" y="352" font-size="11.5" fill="#9db8a6">duplicate SPN registrations</text>
      <text x="884" y="372" font-size="11" fill="#54705f">Kerberos hygiene</text>
    </g>

    <!-- arrows -->
    <line x1="226" y1="246" x2="260" y2="246" stroke="#2fae5f" stroke-width="1.6" marker-end="url(#arrB)"/>
    <line x1="386" y1="96" x2="386" y2="76" stroke="#2fae5f" stroke-width="1.5"/>
    <line x1="386" y1="76" x2="1022" y2="76" stroke="#2fae5f" stroke-width="1.5"/>
    <line x1="696" y1="76" x2="696" y2="90" stroke="#2fae5f" stroke-width="1.4" marker-end="url(#arrB)"/>
    <line x1="1022" y1="76" x2="1022" y2="90" stroke="#2fae5f" stroke-width="1.4" marker-end="url(#arrB)"/>
    <text x="700" y="68" font-size="11" fill="#54705f">runs each Test-* check against the imported data</text>

    <!-- bottom: findings -->
    <rect x="24" y="428" width="480" height="150" rx="10" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="42" y="454" font-size="12" fill="#54705f">findings collection</text>
    <text x="42" y="480" font-size="13.5" fill="#e9f5ec">$allFindings — one object per issue</text>
    <text x="42" y="504" font-size="12" fill="#9db8a6">· summarized by severity in the report</text>
    <text x="42" y="528" font-size="12" fill="#9db8a6">· zero findings → "No findings discovered."</text>
    <text x="42" y="556" font-size="12" fill="#9db8a6">· each check is Pester-tested in isolation</text>

    <!-- bottom: reports -->
    <rect x="528" y="428" width="648" height="150" rx="10" fill="#0a100c" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="546" y="454" font-size="12" fill="#54705f">Reports\ — AuditFindings_yyyyMMdd_HHmmss.*</text>
    <rect x="546" y="466" width="200" height="40" rx="6" fill="#0f2417" stroke="#2fae5f"/>
    <text x="646" y="491" text-anchor="middle" font-size="12" fill="#33ff66">.html — dark, self-contained</text>
    <rect x="758" y="466" width="160" height="40" rx="6" fill="#0f1a12" stroke="#2fae5f"/>
    <text x="838" y="491" text-anchor="middle" font-size="12" fill="#9db8a6">.csv — raw findings</text>
    <rect x="930" y="466" width="160" height="40" rx="6" fill="#0f1a12" stroke="#2fae5f"/>
    <text x="1010" y="491" text-anchor="middle" font-size="12" fill="#9db8a6">.json — raw findings</text>
    <text x="546" y="534" font-size="12" fill="#9db8a6">Private/ New-HtmlReport.ps1 renders the HTML</text>
    <text x="546" y="558" font-size="12" fill="#54705f">Tests/ ADSecurityAuditor.Tests.ps1 — Pester suite</text>

    <line x1="696" y1="392" x2="696" y2="420" stroke="#2fae5f" stroke-width="1.3" marker-end="url(#arrB)"/>
    <line x1="1022" y1="392" x2="1022" y2="420" stroke="#2fae5f" stroke-width="1.3" marker-end="url(#arrB)"/>
  </g>

  <text x="600" y="626" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#54705f">◈ read-only · offline CSV analysis · no live domain connection · PowerShell 5.1 · nothing is modified</text>
</svg>
